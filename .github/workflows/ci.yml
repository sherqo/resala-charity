name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -q verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: resala-charity
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
